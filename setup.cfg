[metadata]
name = pyfig
version = 0.2.0
description = Save and reopen Matplotlib figures as .pyfig files
long_description = file: README.md
long_description_content_type = text/markdown

[options]
packages = find:
python_requires = >=3.9
install_requires =
    matplotlib>=3.5
    numpy>=1.21

[options.entry_points]
console_scripts =
    pyfig-open = pyfig.cli:main
    open_pyfig = pyfig.cli:main
